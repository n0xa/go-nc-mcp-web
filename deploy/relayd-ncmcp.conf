# Snippet to add to /etc/relayd.conf on .118
#
# If you already have a "protocol https" block for vaultwarden,
# you can reuse it. Otherwise define one:
#
# protocol "https" {
#     tls keypair "vw.h-i-r.net"
# }
#
# The keypair name refers to files:
#   /etc/ssl/vw.h-i-r.net.crt
#   /etc/ssl/private/vw.h-i-r.net.key

relay "ncmcp" {
    listen on 192.168.1.118 port 9443 tls
    protocol "https"
    forward to 127.0.0.1 port 9443
}
